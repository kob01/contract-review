name: contract-review

services:
  db:
    # 无法直连 Docker Hub 的环境可把 PGVECTOR_IMAGE 指向镜像站，例如
    # docker.m.daocloud.io/pgvector/pgvector:pg16
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg16}
    container_name: contract-review-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: contract_review
      POSTGRES_USER: contract_review
      POSTGRES_PASSWORD: contract_review
    ports:
      # 只可改宿主机侧端口（容器内 Postgres 固定监听 5432）；默认 5433 是为了避开
      # 本机其他项目已经占用的 5432，改完记得同步 .env 里 DATABASE_URL 的端口
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 后端启动依赖 vector 扩展可用，因此探针直接验证扩展能否加载
      test:
        [
          "CMD-SHELL",
          "pg_isready -U contract_review -d contract_review && psql -U contract_review -d contract_review -c 'CREATE EXTENSION IF NOT EXISTS vector;'",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    # 任务队列后端（ARQ）。无法直连 Docker Hub 时改 REDIS_IMAGE 指向镜像站
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: contract-review-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # 只监听本机：队列不是对外服务
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    # 稠密向量库（加速层）：只存 {主键, 向量, 过滤 payload}，权威文本仍以 Postgres 为单一数据源
    # 无法直连 Docker Hub 时把 QDRANT_IMAGE 指向镜像站，与 PGVECTOR_IMAGE 同口径
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.12.4}
    container_name: contract-review-qdrant
    restart: unless-stopped
    ports:
      # 宿主侧避开可能被占用的 6333；容器内固定 6333(REST) / 6334(gRPC)
      - "${QDRANT_HTTP_PORT:-16333}:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  backend:
    build:
      context: ./backend
    container_name: contract-review-backend
    restart: unless-stopped
    env_file:
      - .env
      # API 密钥从仓库上级目录的 .env 取（与后端 dotenv 查找链一致）；文件缺失时不影响启动
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://contract_review:contract_review@db:5432/contract_review
      REDIS_URL: redis://redis:6379/0
      # 容器内 qdrant 服务名互访走 6333（与宿主 16333 区分）
      QDRANT_URL: http://qdrant:6333
      # 容器内前端由 nginx 反代，Origin 走浏览器侧 5173/8081
      CORS_ORIGINS: http://localhost:5173,http://localhost:8081
      UPLOAD_DIR: /app/storage/contracts
      # API 进程只接单与读库，可以开多 worker；每个进程一个连接池，
      # worker 数 x (DB_POOL_SIZE + DB_MAX_OVERFLOW) 不要超过 Postgres max_connections
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - contract-storage:/app/storage

  worker:
    # 审查任务执行进程：与 API 同镜像不同 command。
    # 分开是因为分钟级长任务放在 Web 进程里，一次发版就会把在跑的任务带走
    build:
      context: ./backend
    container_name: contract-review-worker
    restart: unless-stopped
    command: ["python", "-m", "app.tasks.worker"]
    env_file:
      - .env
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://contract_review:contract_review@db:5432/contract_review
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      UPLOAD_DIR: /app/storage/contracts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      backend:
        condition: service_started
    volumes:
      - contract-storage:/app/storage

  frontend:
    build:
      context: ./frontend
    container_name: contract-review-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 宿主 8080 已被本机 TEI 重排服务占用，前端对外改走 8081
      - "8081:80"

volumes:
  pgdata:
  contract-storage:
  redisdata:
  qdrantdata:
