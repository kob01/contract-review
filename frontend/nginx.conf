server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- 长任务与短请求在反代层就分路 ----------
    # 审查执行已经交给 worker 进程，接口本身都是秒级；这里分离的目的是
    # 让"上传 20MB 合同"和"每 3 秒一次的状态轮询"不共用一条超时口径，
    # 也不因为一个慢请求占满 upstream 连接就把另一类请求拖死。

    # 状态轮询：请求小、频率高，超时给足 10s 就该判定后端异常
    location ^~ /api/v1/reviews/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # 合同原件与上传：大文件双向传输，关闭缓冲避免内存堆积，超时放宽
    location ~ ^/api/v1/contracts/([^/]+)/(file|reparse|reviews)$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        client_max_body_size 20m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 上传接口是“上传 + 同步解析”一起做完才返回，大文件要给足时间
    location = /api/v1/contracts {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        client_max_body_size 20m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        client_max_body_size 20m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
